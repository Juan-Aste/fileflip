name: CI

# GitHub Actions minutes are limited on this private repo, so:
# - pushes run only the quick `check` job, and not at all when a commit only
#   touches the agent lock or docs;
# - the heavy browser jobs (other engines, AI voice model) run on pull
#   requests to main (the release gate) and on demand (workflow_dispatch).
#   The scheduled agent still runs them locally before marking a task done.
on:
  push:
    branches: [dev, main]
    paths-ignore:
      - ".agent-lock"
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer commit on the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Unit tests check our outputs with independent tools: Python's zipfile
      # (ZIP, UTF-8 names), GNU tar, ffmpeg (audio, subtitles) and poppler
      # (pdftotext, pdfinfo, pdftoppm, pdfimages). The Ubuntu 26 runner image
      # no longer ships ffmpeg or poppler, so they are installed here.
      - name: System tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg poppler-utils python3-openpyxl
          python3 --version && tar --version | head -1 && ffmpeg -version | head -1 && pdftotext -v
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # With a test AdSense id, so check:adsense can see the code in every <head>
      # (e2e-browsers builds without it: adsense-head.spec.ts checks none).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ADSENSE_CLIENT: ca-pub-0000000000000000
      - name: Static pages
        run: npm run check:static
      - name: AdSense code in every page head
        run: npm run check:adsense
        env:
          NEXT_PUBLIC_ADSENSE_CLIENT: ca-pub-0000000000000000

  # The read-aloud AI voice with the real Supertonic 3 model: reading with
  # pause and resume, the Cache API, and an MP3 in es, en, pt and fr checked
  # with ffprobe/ffmpeg. The model (~400 MB, from Hugging Face) lives in a
  # cached browser profile, so it is downloaded once per model version.
  e2e-ai-voice:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Chromium and ffmpeg
        run: npx playwright install --with-deps chromium && sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build
        run: npm run build
      - name: Browser profile with the AI voice model
        uses: actions/cache@v4
        with:
          path: .cache/tts-profile
          key: tts-profile-${{ hashFiles('src/lib/tts/model.ts') }}
      - name: AI voice with the real model
        run: npx playwright test tts-ai --project chromium -g "real model"
        env:
          TTS_REAL_MODEL: "1"
          TTS_MODEL_PROFILE: .cache/tts-profile
      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ai-voice-results
          path: test-results/
          retention-days: 7

  # Browser tests in other engines: one representative test per tool family
  # (tagged @xb) in Firefox and WebKit, on desktop and in iPhone (WebKit)
  # and Android (Chromium) emulation, plus the quick Chromium checks that
  # every control on open menus, dialogs and results can be clicked and
  # that tools explain when the browser lacks an API they need or a request
  # fails, hangs or goes offline, and the app started with missing variables
  # and MongoDB or Gotenberg down (environments.spec.ts), and hard real-world
  # files in every tool family (edge-files*.spec.ts), and the security
  # headers, session cookies, access control, API body and rate limits
  # (security-headers, access-control, api-limits and rate-limits specs),
  # email sign-in with the real Auth.js behind a proxy (login-real) and the
  # site with the Pro plan switched off (pro-switch) and the legal texts (legal),
  # and the AI voice confirmation and failures (tts-ai; its real-model tests
  # need TTS_REAL_MODEL=1).
  # Runs on the plain runner, not in Playwright's image: the tests also check
  # outputs with poppler (pdftotext, pdfinfo, pdftoppm), patch and ffmpeg,
  # which that image lacks and can't install as its non-root user.
  e2e-browsers:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Browsers of the Playwright version in package.json with their system
      # libraries, xvfb, and the independent validators of the tests.
      - name: Browsers and system tools
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y -qq --no-install-recommends poppler-utils patch ffmpeg xvfb
          pdftotext -v && pdfinfo -v && patch --version | head -1 && ffmpeg -version | head -1
      - name: Build
        run: npm run build
      - name: Firefox, WebKit and phone emulation sample
        # xvfb gives headless Firefox WebGL, which MediaPipe needs (people mode of bg-tools).
        run: xvfb-run -a npx playwright test --project firefox --project webkit --project iphone --project android
      - name: Edge-case fixtures (big photos, 500-page PDF, passwords, odd names)
        run: node scripts/fixtures/edge.mjs > /dev/null
      - name: Chromium click, missing-API, failure-state and edge-file checks
        run: npx playwright test open-states login clickable unsupported failure-states tts-ai billing-states search-locale-states environments edge-files security-headers access-control api-limits rate-limits login-real pro-switch legal adsense-head --project chromium --grep-invert "pages \d+/"
      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
