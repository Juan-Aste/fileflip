# Local development services. Run: docker compose up -d
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    ports:
      - "3001:3000"
    command:
      - "gotenberg"
      - "--api-timeout=90s"
      # Markdown → PDF prints app-generated pages: no JavaScript and no network (SSRF).
      - "--chromium-disable-javascript=true"
      - "--chromium-deny-private-ips=true"
      - "--chromium-deny-public-ips=true"

volumes:
  mongo-data:
